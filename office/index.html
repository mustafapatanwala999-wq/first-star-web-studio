<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Office · First Star Web Studio</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="../img/favicon.svg?v=2" type="image/svg+xml"><link rel="icon" href="../img/favicon.png?v=2" type="image/png" sizes="64x64">
<style>
@font-face{font-family:'HG';font-weight:400;font-display:swap;src:url(../fonts/hanken-grotesk-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'HG';font-weight:600;font-display:swap;src:url(../fonts/hanken-grotesk-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'FR';font-weight:300;font-style:italic;font-display:swap;src:url(../fonts/fraunces-latin-300-italic.woff2) format('woff2')}
@font-face{font-family:'FR';font-weight:400;font-style:normal;font-display:swap;src:url(../fonts/fraunces-latin-300-normal.woff2) format('woff2')}
@font-face{font-family:'PM';font-weight:500;font-display:swap;src:url(../fonts/ibm-plex-mono-latin-500-normal.woff2) format('woff2')}
:root{--ink:#07081a;--cream:#f2ede3;--mute:#8f92b8;--dim:#4e517c;--gold:#f5b800;--gold2:#ffd35a;--ease:cubic-bezier(.16,1,.3,1);color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:radial-gradient(900px 600px at 80% -10%,#1b1d5a 0,transparent 60%),var(--ink);color:var(--cream);font:400 16px/1.5 'HG',system-ui,sans-serif;display:grid;place-items:center;padding:24px max(20px,env(safe-area-inset-left)) 24px max(20px,env(safe-area-inset-right));-webkit-font-smoothing:antialiased}
main{max-width:460px;text-align:center;display:grid;gap:22px;justify-items:center;animation:in .9s var(--ease)}
@keyframes in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.star{width:64px;height:64px;animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
h1{font:400 clamp(34px,7vw,48px)/1.05 'FR',Georgia,serif}
h1 em{font-style:italic;font-weight:300;color:var(--gold2)}
p{color:var(--mute)}
a.go{display:inline-flex;gap:10px;align-items:center;background:var(--gold);color:var(--ink);text-decoration:none;font-weight:600;padding:14px 26px;border-radius:999px;transition:background .2s,transform .3s var(--ease)}
a.go:hover{background:var(--gold2);transform:translateY(-2px)}
a.go:focus-visible{outline:2px solid var(--gold2);outline-offset:3px}
small{font:500 11px 'PM',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
small a{color:inherit}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<main>
  <svg class="star" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2c1.2 7.6 6.4 12.8 14 14-7.6 1.2-12.8 6.4-14 14-1.2-7.6-6.4-12.8-14-14 7.6-1.2 12.8-6.4 14-14z" fill="#f5b800"/></svg>
  <h1>Studio <em>Office</em></h1>
  <p>The live office floor, every team at work, is private. It opens only for the studio's own signed-in account.</p>
  <a class="go" href="https://claude.ai/artifact/PQ9amT4feqeUvMnSg6PLsX" rel="noopener">Open the office <span aria-hidden="true">→</span></a>
  <small><a href="../">Back to First Star Web Studio</a></small>
</main>
</body>
</html>
