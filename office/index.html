<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Office · First Star</title><meta name="robots" content="noindex,nofollow"><link rel="icon" href="../img/favicon.svg?v=2" type="image/svg+xml">
<style>
@font-face{font-family:'HG';font-weight:400;src:url(../fonts/hanken-grotesk-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'HG';font-weight:600;src:url(../fonts/hanken-grotesk-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'FR';font-weight:300;font-style:italic;src:url(../fonts/fraunces-latin-300-italic.woff2) format('woff2')}
@font-face{font-family:'PM';font-weight:500;src:url(../fonts/ibm-plex-mono-latin-500-normal.woff2) format('woff2')}
:root{--ink:#07081a;--card:#0f1130;--cream:#f2ede3;--mute:#8f92b8;--gold:#f5b800;--gold2:#ffd35a;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;color-scheme:dark}
*{box-sizing:border-box;margin:0}body{background:radial-gradient(900px 600px at 85% -10%,#1b1d5a,transparent 60%),var(--ink);color:var(--cream);font:16px/1.5 'HG',system-ui,sans-serif;padding:28px 16px 60px}
.w{max-width:1100px;margin:auto}header{display:flex;justify-content:space-between;align-items:end;flex-wrap:wrap;gap:12px;margin-bottom:26px}
h1{font:300 italic clamp(34px,6vw,58px)/1 'FR',serif}h1 b{color:var(--gold);font-style:normal}.mono{font:500 12px 'PM',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.pulse{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(74,222,128,.7);animation:p 1.8s infinite;margin-right:8px;vertical-align:middle}
.pulse.bad{background:var(--bad);animation:none}@keyframes p{70%{box-shadow:0 0 0 12px rgba(74,222,128,0)}100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}}
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
.c{background:var(--card);border:1px solid rgba(245,184,0,.18);border-radius:18px;padding:18px}.n{font:600 clamp(32px,4vw,46px)/1 'HG';color:var(--gold)}.l{color:var(--mute);font-size:14px;margin-top:6px}
h2{font:500 12px 'PM',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--gold2);margin:28px 0 12px}
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.t{background:var(--card);border-radius:18px;padding:18px;border:1px solid rgba(255,255,255,.06);position:relative;overflow:hidden}
.t h3{font-size:18px;font-weight:600;display:flex;align-items:center;gap:10px}.t p{color:var(--mute);font-size:14px;margin-top:6px}.t .s{font:500 12px 'PM',monospace;margin-top:12px}
.t.on{border-color:rgba(74,222,128,.35)}.t.on::after{content:"";position:absolute;left:0;bottom:0;height:2px;width:40%;background:linear-gradient(90deg,transparent,var(--ok),transparent);animation:scan 2.4s linear infinite}
@keyframes scan{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
.t.off{opacity:.55}.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.feed{display:flex;flex-direction:column;gap:6px}.f{display:flex;gap:14px;align-items:center;background:var(--card);border-radius:12px;padding:10px 14px;font-size:15px}.f time{font:500 13px 'PM',monospace;color:var(--gold2);min-width:70px}
footer{margin-top:34px;color:var(--mute);font-size:13px}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body><div class="w">
<header><div><div class="mono">First Star Web Studio</div><h1>The <b>Office</b>, live</h1></div><div class="mono" id="st"><span class="pulse"></span>Loading…</div></header>
<div class="nums">
<div class="c"><div class="n" id="sentToday">–</div><div class="l">emails sent today</div></div>
<div class="c"><div class="n" id="sentAll">–</div><div class="l">sent in total</div></div>
<div class="c"><div class="n" id="queued">–</div><div class="l">checked, ready to send</div></div>
<div class="c"><div class="n" id="replies">–</div><div class="l">replies</div></div>
<div class="c"><div class="n" id="leads">–</div><div class="l">leads found</div></div></div>
<h2>Teams at work</h2><div class="teams" id="teams"></div>
<h2>Latest emails out</h2><div class="feed" id="feed"></div>
<footer>Updated from the studio server every 10 minutes. <a href="../" style="color:var(--gold2)">firststarwebstudio.com</a></footer></div>
<script>
const TEAMS={'first-star-web-studio-sender':['Sales · Sender','Sends one pitch about every 5 minutes, across 3 mailboxes'],
'first-star-web-studio-health':['Ops · Health check','Watches the mailboxes, bounces and the circuit breaker'],
'first-star-web-studio-db-snapshot':['Ops · Backups','Snapshots the lead database'],
'first-star-web-studio-leads-pass-feeder':['Research · Lead finder','Finds and checks new businesses with outdated sites'],
'first-star-web-studio-leads-build':['Design · Template builder','Fills category templates for new leads']};
const nice=u=>TEAMS[u]||[u.replace('first-star-web-studio-','').replace(/-/g,' ').replace(/^./,c=>c.toUpperCase()),'Scheduled job on the server'];
const ago=ms=>{const m=Math.round(ms/60000);return m<1?'just now':m<60?m+' min ago':Math.round(m/60)+' h ago'};
const dub=t=>new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Dubai'});
async function go(){try{const d=await (await fetch('../hq-6f8595490b/live.json?'+Date.now(),{cache:'no-store'})).json();
for(const k of ['sentToday','sentAll','queued','replies','leads'])document.getElementById(k).textContent=Number(d[k]||0).toLocaleString();
const lag=Date.now()-new Date(d.lastSent),live=lag<25*60000;
document.getElementById('st').innerHTML=`<span class="pulse ${live?'':'bad'}"></span>${live?'Sending':'Quiet'} · last email ${ago(lag)}`;
document.getElementById('teams').innerHTML=(d.timers||[]).map(t=>{const [n,p]=nice(t.unit),last=t.last?Date.now()-t.last/1000:null,on=!!t.next;
return `<div class="t ${on?'on':'off'}"><h3><span class="pulse ${on?'':'bad'}"></span>${n}</h3><p>${p}</p><div class="s ${on?'ok':'warn'}">${last===null?'waiting for first run':'last ran '+ago(last)}${t.next?' · next '+dub(t.next/1000):''}</div></div>`}).join('');
document.getElementById('feed').innerHTML=(d.recent||[]).map(t=>`<div class="f"><time>${dub(t)}</time>Pitch email sent · ${ago(Date.now()-new Date(t))}</div>`).join('')}
catch(e){document.getElementById('st').textContent='Could not reach the live feed'}}
go();setInterval(go,60000);
</script></body></html>
