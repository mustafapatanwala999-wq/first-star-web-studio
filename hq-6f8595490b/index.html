<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#0b0d12">
<title>First Star HQ</title>
<!-- Live HQ (Nov 9). Data: ~/Ai/engine/hq_live.py pushes an AES-GCM encrypted file to the hq-data branch every 2 min.
     This page decrypts it in the browser with Mustafa's passcode. Zero Claude tokens. -->
<style>
:root{--bg:#0b0d12;--card:#141821;--line:#232a36;--tx:#e9edf3;--mut:#8b95a7;--ok:#3ddc84;--warn:#ffb020;--bad:#ff5a5f;--gold:#f5c542;--r:14px}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif}
body{padding:16px;padding-bottom:40px}
button,input{font:inherit}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
h1{font-size:18px;margin:0;letter-spacing:.2px}h1 b{color:var(--gold)}
.upd{font-size:12px;color:var(--mut)}.upd.stale{color:var(--bad);font-weight:600}
.btn{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:7px 11px;cursor:pointer}
.grid{display:grid;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.card h2{font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--mut);margin:0 0 10px;font-weight:600}
.hero{display:flex;gap:16px;align-items:center}
.ring{--p:0;--c:var(--bad);width:112px;height:112px;flex:none;border-radius:50%;display:grid;place-items:center;
 background:conic-gradient(var(--c) calc(var(--p)*1%),#252c39 0)}
.ring>div{width:88px;height:88px;border-radius:50%;background:var(--card);display:grid;place-items:center;text-align:center}
.ring b{font-size:32px;line-height:1}.ring small{display:block;font-size:11px;color:var(--mut)}
.parts{flex:1;min-width:0;display:grid;gap:6px;font-size:13px}
.part{display:flex;gap:8px;align-items:flex-start}.part i,.job i{flex:none;width:9px;height:9px;border-radius:50%;margin-top:5px}
.part span,.job span{min-width:0}.part em,.job em{display:block;font-style:normal;color:var(--mut);font-size:12px;overflow-wrap:anywhere}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.tile b{font-size:28px;display:block;line-height:1.1}.tile span{font-size:12px;color:var(--mut)}
.list{display:grid;gap:8px;font-size:13px;padding:0;margin:0}.list li{list-style:none}
.need{border-left:3px solid var(--warn);padding:4px 0 4px 10px;overflow-wrap:anywhere}
.need code{background:#0b0d12;border:1px solid var(--line);border-radius:6px;padding:1px 5px;font-size:12px}
.tvs{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.sites{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.site{background:#07080b;border:1px solid var(--line);border-radius:12px;overflow:hidden}.site .scr{aspect-ratio:16/10;background:#0e1118 center top/cover no-repeat}.site .cap{padding:7px 9px;font-size:12px;overflow-wrap:anywhere}.site .cap b{display:block;font-size:13px}.site .cap span{color:var(--mut)}
@media(min-width:760px){.sites{grid-template-columns:repeat(4,1fr)}}
.tv{background:#07080b;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tv .scr{aspect-ratio:4/5;background:#0e1118 center top/cover no-repeat;display:grid;place-items:center;color:var(--mut);font-size:11px}
.tv .cap{padding:7px 9px;font-size:12px;overflow-wrap:anywhere}.tv .cap b{display:block;color:var(--gold);font-size:10px;letter-spacing:1px;text-transform:uppercase}
.dept{display:grid;gap:6px}.job{display:flex;gap:8px;font-size:13px;align-items:flex-start}
.dh{font-size:12px;color:var(--gold);margin:8px 0 2px;text-transform:capitalize}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:7px 6px;border-top:1px solid var(--line);vertical-align:top}
th{color:var(--mut);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.8px;border-top:0}
td.st{color:var(--mut);font-size:12px}.tw{overflow-x:auto;max-height:440px;overflow-y:auto}
input.s{width:100%;background:#0b0d12;border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:8px 10px;margin-bottom:8px}
.ok{background:var(--ok)}.bad{background:var(--bad)}.warn{background:var(--warn)}
#lock{max-width:360px;margin:12vh auto;text-align:center}#lock #pw{width:100%;margin:12px 0;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--tx);text-align:center}
#lock label{font-size:13px;color:var(--mut)}#err{color:var(--bad);font-size:13px;min-height:18px}
a{color:var(--gold)}
@media(min-width:760px){.tiles{grid-template-columns:repeat(4,1fr)}.tvs{grid-template-columns:repeat(4,1fr)}
 .two{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}}
/* Landscape button: the whole overview turned sideways on a phone held upright */
body.land{overflow-x:hidden}
body.land #app{width:100vh;width:100dvh;transform:rotate(90deg) translateY(-100%);transform-origin:top left;position:absolute;top:0;left:0;padding:16px}
body.land #app .tiles,body.land #app .tvs{grid-template-columns:repeat(4,1fr)}
body.land #app .two{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
@media(orientation:landscape){body.land #app{transform:none;width:auto;position:static;padding:0}}
</style></head><body>
<div id="lock"><h1>First Star <b>HQ</b></h1><p class="upd">Private. Enter your passcode.</p>
 <input id="pw" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="passcode" aria-label="Passcode">
 <label><input type="checkbox" id="rem" checked style="margin:0 6px 0 0">Remember on this device</label>
 <div><button class="btn" id="go" style="margin-top:12px;width:100%">Open</button></div><p id="err" role="alert"></p></div>
<div id="app" hidden>
 <header><div><h1>First Star <b>HQ</b></h1><div class="upd" id="upd">loading…</div></div>
  <div style="display:flex;gap:6px"><button class="btn" id="land" aria-pressed="false">⟲ Landscape</button><button class="btn" id="out">Lock</button></div></header>
 <div class="grid">
  <section class="card hero"><div class="ring" id="ring"><div><span><b id="sc">–</b><small>/100 org</small></span></div></div><div class="parts" id="parts"></div></section>
  <section class="tiles" id="tiles"></section>
  <section class="card" id="needc"><h2>Needs you</h2><ul class="list" id="needs"></ul></section>
  <section class="card"><h2>TVs</h2><div class="tvs" id="tvs"></div></section>
  <section class="card"><h2>Websites built · newest first</h2><div class="sites" id="sites"></div></section>
  <div class="two grid">
   <section class="card"><h2>Departments · live</h2><div class="dept" id="jobs"></div></section>
   <section class="card"><h2>Confirmed &amp; meetings</h2><ul class="list" id="conf"></ul><h2 style="margin-top:14px">Next reels</h2><ul class="list" id="reels"></ul></section>
  </div>
  <section class="card"><h2>Pipeline</h2><input class="s" id="q" placeholder="Search leads" aria-label="Search leads"><div class="tw"><table><thead><tr><th>#</th><th>Lead</th><th>Status</th><th>Deadline</th></tr></thead><tbody id="leads"></tbody></table></div></section>
 </div>
</div>
<script>
const SRC=['https://api.github.com/repos/mustafapatanwala999-wq/first-star-web-studio/contents/hq.enc.json?ref=hq-data',
 'https://raw.githubusercontent.com/mustafapatanwala999-wq/first-star-web-studio/hq-data/hq.enc.json'];
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let PASS=null,DATA=null,timer=null,clock=null,keyCache={};
function store(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}
function load(k){try{return localStorage.getItem(k)}catch(e){return null}}
async function fetchEnc(){for(const u of SRC){try{const api=u.includes('api.github');
  const r=await fetch(api?u+'&t='+Date.now():u,{headers:api?{Accept:'application/vnd.github.raw'}:{},cache:'no-store'});if(r.ok)return await r.json()}catch(e){}}
 throw new Error('offline')}
async function decrypt(enc,pass){const ck=enc.salt+'|'+pass;let key=keyCache[ck];
 if(!key){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(enc.salt),iterations:enc.it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);keyCache={[ck]:key}}
 const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(enc.iv)},key,b64(enc.ct));return JSON.parse(new TextDecoder().decode(pt))}
function ago(iso){const m=Math.round((Date.now()-Date.parse(iso))/6e4);return m<1?'just now':m<60?m+' min ago':Math.round(m/60)+' h ago'}
const dot=ok=>ok===true?'ok':ok===false?'bad':'warn';
const ROLE={last_site:'Last site',last_reel:'Last reel',next_reel:'Next reel',next_site:'Next site'};
function render(d){DATA=d;const s=d.score,col=s>=100?'var(--ok)':s>=75?'var(--gold)':'var(--bad)';
 $('ring').style.setProperty('--p',s);$('ring').style.setProperty('--c',col);$('sc').textContent=s;$('sc').style.color=col;
 $('parts').innerHTML=d.parts.map(p=>`<div class="part"><i class="${p.v>=1?'ok':p.v>0?'warn':'bad'}"></i><span>${esc(p.n)}<em>${esc(p.d)}</em></span></div>`).join('');
 const T=d.tiles;$('tiles').innerHTML=[[T.companies,'Companies emailed today',`${T.people} people · ${T.expected} expected by now`],[T.replies,'Replies today',''],[T.confirmed,'Confirmed / meetings',''],[T.posted_today,'Posts today',`${d.reels.ready} reels ready`]]
  .map(([v,l,x])=>`<div class="tile"><b>${esc(v)}</b><span>${esc(l)}${x?'<br>'+esc(x):''}</span></div>`).join('');
 const nd=[...Object.values(d.tickets||{}).map(v=>'Problem: '+v.text),...(d.needs||[])];
 $('needc').hidden=!nd.length;$('needs').innerHTML=nd.map(x=>`<li class="need">${esc(x).replace(/`([^`]+)`/g,'<code>$1</code>')}</li>`).join('');
 $('sites').innerHTML=(d.sites||[]).map(w=>`<div class="site"><div class="scr" style="${w.img?`background-image:url('${w.img}')`:''}"></div><div class="cap"><b>${w.n?'#'+esc(w.n)+' ':''}${esc(w.title)}</b><span>${esc(w.status||'')} · ${ago(w.built)}</span></div></div>`).join('')||'<p class="upd">no websites yet</p>';
 $('tvs').innerHTML=(d.tvs||[]).map(t=>`<div class="tv"><div class="scr" style="${t.img?`background-image:url('${t.img}')`:''}">${t.img?'':'standby'}</div><div class="cap"><b>${esc(ROLE[t.role]||t.role)}</b>${esc(t.title||'–')}${t.slot?' · '+esc(t.slot):''}${t.url?` · <a href="${esc(t.url)}" target="_blank" rel="noopener">open</a>`:''}</div></div>`).join('')||'<p class="upd">no TV feed yet</p>';
 const by={};(d.jobs||[]).forEach(j=>(by[j.dept||'other']=by[j.dept||'other']||[]).push(j));
 $('jobs').innerHTML=Object.entries(by).map(([k,js])=>`<div class="dh">${esc(k)}</div>`+js.map(j=>`<div class="job"><i class="${dot(j.ok)}"></i><span>${esc(j.name)}${j.desc&&j.dept!=='always on'?' · '+esc(j.desc):''}<em>${esc(j.summary||'')}${j.last_ok?' · ok '+ago(j.last_ok):''} · ${esc(Array.isArray(j.schedule)?j.schedule.join(', '):j.schedule)}</em></span></div>`).join('')).join('');
 if((d.workers||[]).length)$('jobs').innerHTML+=`<div class="dh">background workers</div>`+d.workers.map(w=>`<div class="job"><i class="${dot(w.ok)}"></i><span>${esc(w.name)}${w.running?' · working now ('+esc(w.stage)+')':''}<em>${esc(w.text||'')}${w.last?' · '+ago(w.last):''}</em></span></div>`).join('');
 $('conf').innerHTML=(d.confirmed||[]).map(c=>`<li><b>${esc(c.company)}</b><br><span class="upd">${esc(c.status)}${c.next?' · next: '+esc(c.next):''}</span></li>`).join('')||'<li class="upd">none yet</li>';
 $('reels').innerHTML=(d.reels.next||[]).map(r=>`<li>${esc(r.date)} ${esc(r.slot||'')} · ${esc(r.lead)} <span class="upd">${esc(r.type||'')}</span></li>`).join('')||'<li class="upd">queue empty</li>';
 drawLeads();tick()}
function drawLeads(){if(!DATA)return;const q=$('q').value.toLowerCase();
 $('leads').innerHTML=(DATA.leads||[]).filter(l=>!q||JSON.stringify(l).toLowerCase().includes(q)).map(l=>`<tr><td>${esc(l.n)}</td><td>${esc(l.name)}<br><span class="upd">${esc(l.country||'')}</span></td><td class="st">${esc(l.status)}</td><td>${esc(l.deadline||'')}</td></tr>`).join('')}
function tick(){if(!DATA)return;const m=(Date.now()-Date.parse(DATA.at))/6e4;$('upd').textContent='updated '+ago(DATA.at)+(m>10?' · NOT UPDATING (Mac off or offline?)':'');$('upd').classList.toggle('stale',m>10)}
async function refresh(){try{render(await decrypt(await fetchEnc(),PASS))}catch(e){if(e.name==='OperationError'){lock('Passcode changed, enter the new one');return}$('upd').textContent='cannot reach data, retrying';}}
function lock(msg){clearInterval(timer);clearInterval(clock);PASS=null;store('fshq',null);$('app').hidden=true;$('lock').hidden=false;$('err').textContent=msg||''}
async function unlock(pass){if(!pass)return;$('err').textContent='checking…';try{const d=await decrypt(await fetchEnc(),pass);PASS=pass;if($('rem').checked)store('fshq',pass);
 $('lock').hidden=true;$('app').hidden=false;$('err').textContent='';render(d);clearInterval(timer);clearInterval(clock);timer=setInterval(refresh,120000);clock=setInterval(tick,30000)}
 catch(e){$('err').textContent=e.name==='OperationError'?'Wrong passcode':'Cannot reach the data right now'}}
const pv=()=>$('pw').value.trim().replace(/%+$/,'').toLowerCase();$('go').onclick=()=>unlock(pv());$('pw').onkeydown=e=>{if(e.key==='Enter')unlock(pv())};
$('out').onclick=()=>lock();$('q').oninput=drawLeads;
$('land').onclick=()=>{const on=document.body.classList.toggle('land');$('land').setAttribute('aria-pressed',on);store('fshq-land',on?'1':null)};
if(load('fshq-land')){document.body.classList.add('land');$('land').setAttribute('aria-pressed','true')}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&PASS)refresh()});
const saved=load('fshq');if(saved)unlock(saved);
</script></body></html>
